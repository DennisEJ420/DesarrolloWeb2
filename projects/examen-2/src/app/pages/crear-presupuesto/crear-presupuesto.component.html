<div class="bg-gradient-custom d-flex align-items-center justify-content-center p-4">
  <div class="card p-4 shadow-lg text-center border-0" style="width: 100%; max-width: 600px; background: rgba(255,255,255,0.95);">
    <h2 class="text-uppercase fw-bold text-secondary mb-4 tracking-wide">Ingrese Presupuesto</h2>
    
    <!--validación error cero -->
    <div *ngIf="error" class="alert alert-danger py-1 px-3 fw-bold text-uppercase small mb-3 border-0 mx-auto" style="width: fit-content; font-size: 0.8rem;">
      El presupuesto debe ser mayor a cero
    </div>

    <div class="mb-4">
      <input type="number" [(ngModel)]="monto" class="form-control form-control-lg text-center fs-3 text-muted bg-white border" placeholder="0">
    </div>

    <button (click)="aceptarPresupuesto()" class="btn btn-secondary btn-lg w-100 text-uppercase fw-semibold py-3 shadow-sm">
      Aceptar
    </button>
  </div>
</div>

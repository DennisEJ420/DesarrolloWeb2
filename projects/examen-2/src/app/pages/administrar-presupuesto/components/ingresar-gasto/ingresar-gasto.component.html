<h4 class="text-center text-muted mb-4 border-bottom pb-2">Ingresar Gasto</h4>

<!-- Validaciones Dinámicas en Pantalla -->
<div *ngIf="errorVacio" class="alert alert-danger py-1 px-2 text-center fw-bold text-uppercase small mb-3 border-0 mx-auto" style="font-size: 0.75rem; width: fit-content;">
  Nombre Gasto o Cantidad Incorrecta
</div>

<div *ngIf="errorExcede" class="alert alert-danger py-1 px-2 text-center fw-bold text-uppercase small mb-3 border-0 mx-auto" style="font-size: 0.75rem; width: fit-content;">
  Cantidad ingresada es mayor al restante
</div>

<div class="mb-3">
  <label class="form-label fw-bold text-secondary small mb-1">Gasto</label>
  <input type="text" [(ngModel)]="nombreGasto" class="form-control" placeholder="Ej: Comida..">
</div>

<div class="mb-4">
  <label class="form-label fw-bold text-secondary small mb-1">Cantidad</label>
  <input type="number" [(ngModel)]="cantidadGasto" class="form-control">
</div>

<button (click)="agregar()" class="btn btn-secondary w-100 text-uppercase fw-semibold py-2 shadow-sm">
  Agregar Gasto
</button>
